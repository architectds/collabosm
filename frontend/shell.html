<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>collabosm</title>
<style>
  /* Colour-blocked on purpose: the panel (header + rail) is always the WebUI's
     opposite. By day the WebUI is white, so the panel is warm ink; by night the
     WebUI is near-black, so the panel turns to paper. Neither end is pure -- #fff
     and #0a0a0a belong to the WebUI, and a panel that repeated them would read as
     part of it. The warmth stays low (little chroma) so it sits beside the WebUI's
     neutral greys instead of fighting them. The WebUI's own mode picks the side. */
  :root {
    --rail: 368px;
    --page: #ffffff; --page-scheme: light;         /* the WebUI's page, behind the iframe */
    --bg: #1b1a18; --raise: #24231f; --fg: #f3efe6; --muted: #aaa498; --faint: #7d786f;
    --line: rgba(243, 239, 230, .09); --line-strong: rgba(243, 239, 230, .18);
    --soft: rgba(243, 239, 230, .055); --ring: rgba(243, 239, 230, .18);
    --inv-bg: #f3efe6; --inv-fg: #1b1a18;
    --shadow: 0 18px 48px rgba(0, 0, 0, .30);
    --cjk: "PingFang SC", "Hiragino Sans", "Microsoft YaHei UI", "Microsoft YaHei",
           "Yu Gothic UI", "Noto Sans CJK SC";
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "JetBrains Mono", Menlo, monospace;
    color-scheme: dark;
  }
  :root:lang(ja) {
    --cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo,
           "Noto Sans JP", "Noto Sans CJK JP";
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0a0a0a; --page-scheme: dark;
      --bg: #eeebe4; --raise: #f6f4ef; --fg: #1b1a18; --muted: #68635a; --faint: #8a847a;
      --line: rgba(27, 26, 24, .10); --line-strong: rgba(27, 26, 24, .20);
      --soft: rgba(27, 26, 24, .05); --ring: rgba(27, 26, 24, .16);
      --inv-bg: #1b1a18; --inv-fg: #eeebe4;
      --shadow: 0 18px 48px rgba(0, 0, 0, .45);
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] {
    --page: #0a0a0a; --page-scheme: dark;
    --bg: #eeebe4; --raise: #f6f4ef; --fg: #1b1a18; --muted: #68635a; --faint: #8a847a;
    --line: rgba(27, 26, 24, .10); --line-strong: rgba(27, 26, 24, .20);
    --soft: rgba(27, 26, 24, .05); --ring: rgba(27, 26, 24, .16);
    --inv-bg: #1b1a18; --inv-fg: #eeebe4;
    --shadow: 0 18px 48px rgba(0, 0, 0, .45);
    color-scheme: light;
  }
  ::selection { background: var(--inv-bg); color: var(--inv-fg); }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, var(--cjk), sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button { font: inherit; color: inherit; }

  /* ---- icons ---------------------------------------------------------- */
  .ico {
    width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ---- header -------------------------------------------------------- */
  header {
    flex: none; height: 52px; display: flex; align-items: center; gap: 12px;
    padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
  .mark { width: 20px; height: 20px; border-radius: 6px; background: var(--fg); display: grid; place-items: center; flex: none; }
  .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--bg); }
  .status {
    display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 42vw; height: 28px;
    padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12.5px;
  }
  .status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
  .dot.on { background: var(--fg); border-color: var(--fg); }
  .dot.busy { border-color: var(--fg); animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 4px var(--ring); } }
  .spacer { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 9px; }
  .seg button {
    height: 26px; min-width: 32px; padding: 0 8px; border: 0; border-radius: 7px;
    background: transparent; color: var(--muted); font-size: 12px; font-weight: 550; cursor: pointer;
  }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center; flex: none; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: 9px; background: transparent;
  }
  .icon-btn:hover { border-color: var(--fg); }

  /* ---- buttons and small parts --------------------------------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    height: 36px; margin-top: 14px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 9px;
    background: transparent; font-weight: 550; cursor: pointer; transition: border-color .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--fg); }
  .btn.primary { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
  .btn.primary:hover:not(:disabled) { opacity: .86; }
  .btn:disabled { opacity: .42; cursor: not-allowed; }
  /* a disabled primary ("Running") is a quiet chip, not a half-transparent slab */
  .btn.primary:disabled { opacity: 1; background: var(--soft); color: var(--muted); border-color: var(--line-strong); }
  .btn .ico { width: 14px; height: 14px; }
  header .btn { width: auto; height: 32px; margin: 0; font-size: 12.5px; }
  .tag {
    display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px solid var(--line-strong);
    border-radius: 999px; font-size: 10.5px; font-weight: 550; color: var(--muted);
    letter-spacing: 0; text-transform: none; white-space: nowrap;
  }
  .tag.solid { background: var(--inv-bg); border-color: var(--inv-bg); color: var(--inv-fg); }
  .mono { font-family: var(--mono); font-size: 11.5px; }

  /* ---- chips: an icon and a value; the words are in the tooltip ------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; height: 28px;
    padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: transparent;
    color: var(--fg); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default;
  }
  .chip .ico { color: var(--muted); }
  .chip b { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .chip.only { width: 28px; padding: 0; justify-content: center; }
  .chip.off { border-style: dashed; color: var(--faint); }
  .chip.off .ico { color: var(--faint); }
  .chip.alert { border-color: var(--fg); }
  .chip.alert .ico { color: var(--fg); }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: var(--fg); }
  .chip.wide { flex: 1 1 100%; }
  #tip {
    position: fixed; z-index: 50; max-width: 272px; padding: 7px 10px; border-radius: 8px;
    background: var(--inv-bg); color: var(--inv-fg); font-size: 12px; line-height: 1.45;
    box-shadow: var(--shadow); pointer-events: none; overflow-wrap: anywhere;
  }

  /* ---- layout -------------------------------------------------------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--rail); }
  main.collapsed { grid-template-columns: minmax(0, 1fr) 0; }
  main.collapsed #rail { display: none; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--page); color-scheme: var(--page-scheme); }
  #rail {
    min-width: 0; overflow-x: hidden; overflow-y: auto; border-left: 1px solid var(--line);
    background: var(--bg); overscroll-behavior: contain; scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  section { padding: 18px 20px 20px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  #toast {
    position: sticky; top: 0; z-index: 3; margin: 0; padding: 11px 20px;
    background: var(--inv-bg); color: var(--inv-fg); font-size: 12.5px;
  }

  /* ---- status: session, note, machine, compute units ------------------ */
  .state { display: flex; align-items: center; gap: 10px; }
  .state b { font-size: 24px; font-weight: 650; letter-spacing: -.025em; line-height: 1.2; }
  .state .pct { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .who { margin-top: 2px; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .steps {
    list-style: none; margin: 16px 0 14px; padding: 0; position: relative;
    display: grid; grid-template-columns: repeat(5, 1fr);
  }
  .steps::before, .steps::after { content: ""; position: absolute; top: 5px; left: 10%; height: 1px; }
  .steps::before { width: 80%; background: var(--line-strong); }
  .steps::after { width: calc(80% * var(--fill, 0)); background: var(--fg); transition: width .5s ease; }
  .steps li {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    gap: 7px; font-size: 11px; color: var(--faint); text-align: center;
  }
  .steps li i { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line-strong); }
  .steps li.done { color: var(--muted); }
  .steps li.done i { background: var(--fg); border-color: var(--fg); }
  .steps li.now { color: var(--fg); font-weight: 650; }
  .steps li.now i { border-color: var(--fg); animation: breathe 1.4s ease-in-out infinite; }
  .bar { height: 4px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .6s ease; }
  .note { margin: 12px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .note:empty { display: none; }
  .fine { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .blk { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sub {
    display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--muted);
    font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
  }
  :lang(zh) .sub, :lang(ja) .sub { letter-spacing: .05em; }
  .sub .tag { margin-left: auto; }
  .res { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .res + .res { margin-top: 10px; }
  .res .ico { color: var(--muted); }
  .res .bar { height: 6px; box-shadow: inset 0 0 0 1px var(--line); }
  .res b { min-width: 96px; text-align: right; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .figure { display: inline-flex; align-items: baseline; gap: 8px; }
  .figure b { font-size: 30px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .figure span { color: var(--muted); font-size: 12px; }
  .figure.none b { color: var(--faint); font-size: 22px; font-weight: 500; }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 16px; }
  .actions .btn { margin: 0; }

  .confirm { margin-top: 16px; padding: 16px; border: 1.5px solid var(--fg); border-radius: 14px; background: var(--raise); }
  .confirm h3 { margin: 0; font-size: 14.5px; font-weight: 650; line-height: 1.4; }
  .confirm .who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin-top: 4px; }
  .confirm .who b { color: var(--fg); }
  .confirm .usd { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .confirm ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  .confirm li + li { margin-top: 4px; }
  .confirm li.warn { color: var(--fg); }
  .figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .figs div { padding: 8px 10px; border-radius: 9px; background: var(--soft); min-width: 0; }
  .figs b { display: block; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .figs small { display: block; margin-top: 1px; color: var(--muted); font-size: 10.5px; line-height: 1.3; }

  /* ---- folds: optional sections, collapsed to one line ---------------- */
  section.fold { padding: 0; }
  .fold h2 { margin: 0; font: inherit; }
  .fold-head {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 15px 20px; border: 0;
    background: transparent; color: var(--muted); cursor: pointer; text-align: left;
    font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
  }
  :lang(zh) .fold-head, :lang(ja) .fold-head { letter-spacing: .05em; }
  .fold-head:hover, .fold-head[aria-expanded="true"] { color: var(--fg); }
  .fold-head > span:not(.fold-sum) { flex: none; white-space: nowrap; }
  .fold-sum {
    margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--faint); font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none;
  }
  .fold-head .chev { transition: transform .2s ease; }
  .fold-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .fold-body { padding: 0 20px 20px; }

  /* ---- GPUs ------------------------------------------------------------ */
  .gpu { padding: 14px; border: 1px solid var(--line-strong); border-radius: 12px; }
  .gpu + .gpu { margin-top: 10px; }
  .gpu.sel { border-color: var(--fg); }
  .gpu .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .gpu .top b { font-size: 14px; font-weight: 650; }
  .gpu .chips { margin-top: 10px; gap: 5px; }
  .gpu .chip { padding: 0 8px; gap: 5px; }
  .pick { position: relative; display: block; margin-top: 12px; }
  .pick select {
    appearance: none; -webkit-appearance: none; width: 100%; height: 34px; padding: 0 32px 0 34px;
    border: 1px solid var(--line-strong); border-radius: 9px; background: var(--raise); color: var(--fg);
    font: inherit; font-size: 12.5px; cursor: pointer; text-overflow: ellipsis;
  }
  .pick select:hover { border-color: var(--fg); }
  .pick select:disabled { cursor: default; opacity: .7; }
  .pick select option { background: var(--raise); color: var(--fg); }
  .pick .ico { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
  .pick .ico.l { left: 11px; }
  .pick .ico.r { right: 11px; }
  .facts {
    list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr;
    gap: 7px 14px; font-size: 12px;
  }
  .facts li { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .facts li span { color: var(--muted); white-space: nowrap; }
  .facts li b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .facts .ico { width: 13px; height: 13px; }
  .facts .est { color: var(--faint); }
  .facts li.est b { color: var(--muted); font-weight: 500; }

  /* ---- speed ----------------------------------------------------------- */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 12px; }
  .stat small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  .stat b { display: inline-block; margin-top: 4px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat span { margin-left: 4px; color: var(--muted); font-size: 12px; }

  /* ---- connection, log --------------------------------------------------- */
  .list { list-style: none; margin: 12px 0 0; padding: 0; font-size: 12px; }
  .list li { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list li .ico { color: var(--muted); }
  .list li .mono { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  details { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  details + details { margin-top: 12px; }
  summary {
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    list-style: none; color: var(--muted); font-size: 12.5px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-family: var(--mono); }
  details[open] summary::after { content: "\2212"; }
  details pre, pre.log {
    margin: 10px 0 0; padding: 10px 12px; max-height: 200px; overflow: auto; border-radius: 10px;
    background: var(--soft); color: var(--muted); font: 11px/1.6 var(--mono);
    white-space: pre-wrap; word-break: break-all;
  }
  pre.log { margin: 0; }

  @media (max-width: 900px) {
    main, main.collapsed { grid-template-columns: minmax(0, 1fr); }
    #rail { position: fixed; top: 52px; right: 0; bottom: 0; z-index: 4; width: min(var(--rail), 100vw); box-shadow: var(--shadow); }
    .brand span:last-child { display: none; }
    .status { max-width: 34vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>collabosm</span></div>
  <div class="status" id="status"><i class="dot" id="dot" aria-hidden="true"></i><span id="status-text"></span></div>
  <span class="tag solid" id="rehearsal" hidden></span>
  <span class="spacer"></span>
  <div class="seg" id="langs" role="group">
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="zh" lang="zh-CN">中</button>
    <button type="button" data-lang="ja" lang="ja">日</button>
  </div>
  <button type="button" class="btn primary" id="stop" data-act="stop" hidden>
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>
    <span id="stop-label"></span>
  </button>
  <button type="button" class="icon-btn" id="toggle">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg>
  </button>
</header>
<main id="main">
  <iframe id="ui" src="/?embed=1" title="collabosm chat" allow="clipboard-write; clipboard-read"></iframe>
  <aside id="rail">
    <p id="toast" role="status" aria-live="polite" hidden></p>
    <section id="s-status"></section>
    <section class="fold" id="f-gpus"></section>
    <section class="fold" id="f-speed"></section>
    <section class="fold" id="f-conn"></section>
    <section class="fold" id="f-log"></section>
  </aside>
</main>
<div id="tip" role="tooltip" hidden></div>
<script>
'use strict';
// The upstream WebUI registers a service worker at scope "/" (workbox, sw.js).
// A shell cached by an older build is how a stale injected panel came back once
// -- a second copy of this rail inside the iframe. Drop both on load: the files
// here are local, so nothing needs to be cached.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
}

// Every word the rail shows. control.py sends codes and numbers only: a note is
// {k, a}, and an answer carries `code`. The rail itself mostly shows icons and
// values; the words live in the tooltips (data-tip), in all three languages.
const I18N = {
  en: {
    'hdr.loading': 'Reading the control plane…',
    'hdr.unreachable': 'Control plane unreachable',
    'badge.rehearsal': 'Rehearsal · nothing billed',
    'btn.stop': 'Stop', 'btn.detach': 'Detach',
    'toggle.hide': 'Hide panel (Ctrl/⌘ B)', 'toggle.show': 'Show panel (Ctrl/⌘ B)',
    'lang.label': 'Language', 'copied': 'Endpoint copied.',
    'tip.stop.ready': 'Stop the VM and end billing (runs down.sh).',
    'tip.stop.job': 'Cancel the job and stop the VM it may have started.',
    'tip.stop.failed': 'Run the stop again (down.sh), for a VM the failure may have left billing.',
    'tip.stop.stale': 'Close the session the ledger never closed (runs down.sh first).',
    'tip.stop.vm': 'Stop the VM that is billing on our session.',
    'tip.stop.attached': 'Detach from the external endpoint. Nothing is stopped: we did not start it.',
    'stage.idle': 'No card', 'stage.requesting': 'Requesting', 'stage.uploading': 'Uploading',
    'stage.bootstrapping': 'Installing', 'stage.loading': 'Loading', 'stage.ready': 'Ready',
    'stage.stopping': 'Stopping', 'stage.stopped': 'Stopped', 'stage.failed': 'Failed',
    'stage.attached': 'External endpoint',
    'step.requesting': 'Request', 'step.uploading': 'Upload', 'step.bootstrapping': 'Install',
    'step.loading': 'Load', 'step.ready': 'Ready',
    'tag.adopted': 'Adopted',
    'tip.adopted': 'Taken over from outside this frontend: billed from the VM’s own uptime, and stoppable here.',

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage blocked */ }
}

let lang = pickLang();
let st = null;          // the last /control/status
let down = null;        // why the control plane could not be read, when it could not
let pending = false;    // a POST is in flight: every action waits for it (Start bills)
const drawn = {};       // section id -> markup it holds; unchanged sections are left alone,
                        // so buttons keep focus and <details> stay open between polls
const openDetails = new Set();
const folds = loadJSON('collabosm.folds', {});    // the viewer's own open/closed choices
const choice = loadJSON('collabosm.choice', {});  // GPU id -> the recipe picked in its selector
let toastTimer = null;

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem('collabosm.lang'); } catch (e) { /* storage blocked */ }
  if (saved && I18N[saved]) return saved;
  const nav = String(navigator.language || '').toLowerCase();
  return nav.startsWith('zh') ? 'zh' : nav.startsWith('ja') ? 'ja' : 'en';
}

function t(key, args, fallback) {
  const s = I18N[lang][key] ?? I18N.en[key] ?? fallback ?? key;
  return args ? s.replace(/\{(\w+)\}/g, (m, k) => (args[k] ?? m)) : s;
}

function num(n, digits) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
  const d = digits ?? 1;
  return new Intl.NumberFormat(LOCALE[lang], { minimumFractionDigits: d, maximumFractionDigits: d })
    .format(Number(n));
}

function clock(sec) {
  if (sec === null || sec === undefined) return '—';
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const two = (x) => String(x).padStart(2, '0');
  return h ? h + ':' + two(m) + ':' + two(s) : m + ':' + two(s);
}

function ago(ts) {
  if (!ts) return '—';
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  return s < 90 ? t('ago.s', { n: s }) : t('ago.m', { n: Math.round(s / 60) });
}

function dur(sec) {
  if (sec === null || sec === undefined || !Number.isFinite(sec)) return '—';
  const m = Math.round(sec / 60), h = Math.floor(m / 60);
  return h ? t('dur.h', { h, m: m % 60 }) : t('dur.m', { m });
}

// 500224 -> "500K", 262144 -> "262K": a context size the way the repo and the model
// cards write it (thousands, not KiB)
function ktok(n) {
  if (!n) return '—';
  return n >= 1e6 ? num(n / 1e6, n % 1e6 ? 1 : 0) + 'M' : Math.round(n / 1000) + 'K';
}

function hostOf(url) {
  try { return new URL(url).host; } catch (e) { return url || '—'; }
}

// A note from control.py, worded in the current language.
function words(n, prefix) {
  if (!n || !n.k) return '';
  const a = Object.assign({}, n.a || {});
  if (a.reason !== undefined) a.reason = t('reason.' + a.reason, null, a.reason);
  if (a.vm !== undefined) a.vm = t('vm.' + a.vm, null, a.vm);
  if (n.k === 'fail.exit') a.why = t('exit.' + a.rc, null, t('exit.other'));
  for (const k of ['cu', 'cuph']) if (typeof a[k] === 'number') a[k] = num(a[k], 2);
  let s = t(prefix + n.k, a, n.k);
  if (a.autostop === 'running' || a.autostop === 'done') s += t('autostop.' + a.autostop);
  return s;
}

function stoppable(s) {
  return (BUSY.includes(s.stage) && s.stage !== 'stopping') || s.stage === 'ready' || s.stage === 'attached'
    || s.stage === 'failed' || (s.ledger_open && (s.stage === 'idle' || s.stage === 'stopped'))
    || (['idle', 'stopped'].includes(s.stage) && oursLive(s));
}

function oursLive(s) {
  return ((s.billing && s.billing.sessions) || []).some((x) => x.ours);
}

function ico(name, cls) {
  return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">'
    + (ICONS[name] || '') + '</svg>';
}

function btn(act, label, kind, icon, attrs) {
  return '<button type="button" class="btn ' + (kind || '') + '" data-act="' + act + '" '
    + (attrs || '') + (pending ? ' disabled' : '') + '>' + (icon ? ico(icon) : '') + esc(label) + '</button>';
}

// An icon and a value; the tooltip (data-t, bound in bindValues) says what it is.
function chip(icon, key, cls) {
  return '<span class="chip' + (cls ? ' ' + cls : '') + '" data-t="' + key + '" tabindex="0">' + ico(icon)
    + (cls && cls.includes('only') ? '' : '<b data-v="' + key + '"></b>') + '</span>';
}

function put(id, html) {
  if (drawn[id] === html) return;
  $(id).innerHTML = html;
  drawn[id] = html;
}

// ---- recipes (recipes.json, through /control/status) ---------------------- //
function recipes() { return (st && st.recipes) || []; }
function recipeById(id) { return recipes().find((r) => r.id === id) || null; }
function currentRecipe() { return recipeById(st && st.selected); }

// A GPU's selector lists the recipes that exist for that card, nothing else.
function gpuRecipes(g) { return recipes().filter((r) => r.gpu === g.id); }
function chosenRecipe(g) {
  const list = gpuRecipes(g);
  return list.find((r) => r.id === choice[g.id]) || list.find((r) => st && r.id === st.selected)
    || list.find((r) => r.verified) || list.find((r) => r.runnable) || list[0] || null;
}

function fact(r, k) { return ((r && r.facts) || {})[k] || null; }

function factValue(k, f) {
  const v = f.v;
  if (v === null || v === undefined) return '—';
  if (k === 'prefill_tps') return num(v, 0) + ' t/s';
  if (k === 'decode_tps') return num(v, 1) + ' t/s';
  if (k === 'context') return ktok(v);
  if (k === 'vision') return t(v ? 'vision.on' : 'vision.off');
  if (k === 'vram_mib') return num(v / 1024, 1) + ' GiB';
  if (k === 'weights') return num(v, 1) + ' GiB';
  if (k === 'eta_min') return '~' + num(v, 0) + ' min';
  return String(v);
}

// ---- folds ------------------------------------------------------------------- //
function isOpen(id) {
  if (id in folds) return !!folds[id];
  const s = st ? st.stage : 'idle';
  if (id === 'gpus') return ['idle', 'stopped', 'failed'].includes(s) || !!(st && st.confirm);
  if (id === 'log') return s === 'failed';
  return false;
}

function foldHTML(id, icon, title, body) {
  const open = isOpen(id);
  return '<h2><button type="button" class="fold-head" data-act="fold" data-fold="' + id + '" aria-expanded="'
    + open + '" aria-controls="b-' + id + '">' + ico(icon) + '<span>' + esc(title) + '</span>'
    + '<span class="fold-sum" data-v="sum-' + id + '"></span>' + ico('chevron', 'chev') + '</button></h2>'
    + (open ? '<div class="fold-body" id="b-' + id + '">' + body() + '</div>' : '');
}

// ---- header ------------------------------------------------------------ //
function stopTip(s) {
  if (s.stage === 'attached') return t('tip.stop.attached');
  if (s.stage === 'ready') return t('tip.stop.ready');
  if (BUSY.includes(s.stage)) return t('tip.stop.job');
  if (s.stage === 'failed') return t('tip.stop.failed');
  if (s.ledger_open && !oursLive(s) && !s.vm) return t('tip.stop.stale');
  return t('tip.stop.vm');
}

function renderHeader() {
  let cls = 'dot', label;
  if (down) label = t('hdr.unreachable');
  else if (!st) label = t('hdr.loading');
  else {
    const s = st.stage, name = t('stage.' + s, null, s);
    if (s === 'ready' || s === 'attached') {
      cls += (st.link && st.link.ok === false) ? '' : ' on';    // hollow while the tunnel is down
      label = name + ' · ' + (st.live_model || '');
    }
    else if (BUSY.includes(s)) {
      cls += ' busy';
      label = s === 'stopping' ? name : name + ' · ' + num(st.progress, 0) + '%';
    } else label = name;
  }
  $('dot').className = cls;
  if ($('status-text').textContent !== label) $('status-text').textContent = label;
  $('status').title = label;
  document.title = 'collabosm · ' + label;
  $('rehearsal').hidden = !(st && st.fake);
  $('rehearsal').textContent = t('badge.rehearsal');
  $('stop').hidden = !(st && stoppable(st));
  $('stop').disabled = pending;
  $('stop-label').textContent = t(st && st.stage === 'attached' ? 'btn.detach' : 'btn.stop');
  if (st) $('stop').dataset.tip = stopTip(st);
  for (const b of document.querySelectorAll('#langs button')) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  }
  $('langs').setAttribute('aria-label', t('lang.label'));
  const collapsed = $('main').classList.contains('collapsed');
  $('toggle').title = t(collapsed ? 'toggle.show' : 'toggle.hide');
  $('toggle').setAttribute('aria-label', $('toggle').title);
  $('toggle').setAttribute('aria-expanded', String(!collapsed));
}

// ---- status: session, note, machine, compute units ------------------------ //
function stepsHTML(s) {
  const at = s === 'ready' ? STEPS.length : STEPS.indexOf(s);
  const fill = s === 'ready' ? 1 : Math.max(0, at) / (STEPS.length - 1);
  let h = '<ol class="steps" style="--fill:' + fill.toFixed(3) + '">';
  STEPS.forEach((k, i) => {
    const cls = i < at ? 'done' : i === at ? 'now' : '';
    h += '<li class="' + cls + '"><i></i><span>' + esc(t('step.' + k)) + '</span></li>';
  });
  return h + '</ol>';
}

function confirmHTML(w) {
  const unmeasured = w.status && w.status !== 'verified';
  return '<div class="confirm" role="group" aria-label="' + esc(t('confirm.head')) + '">'
    + '<h3>' + esc(t('confirm.head')) + '</h3>'
    + '<div class="who"><b>' + esc(w.card) + '</b><span>' + esc(w.model) + '</span></div>'
    + '<div class="figs">'
    + '<div><b>' + num(w.cu_per_hour, 2) + '</b><small>' + esc(t('confirm.cuph')) + '</small></div>'
    + '<div><b>~' + num(w.eta_min, 0) + '</b><small>' + esc(t('confirm.eta')) + '</small></div>'
    + '<div><b>~' + num(w.cu_estimate, 1) + '</b><small>' + esc(t('confirm.need')) + '</small></div>'
    + '</div>'
    + '<p class="usd">' + esc(t('confirm.usd', { usd: num(w.usd_per_hour, 2) })) + '</p>'
    + '<ul>'
    + (unmeasured ? '<li class="warn">' + esc(t('confirm.unmeasured')) + '</li>' : '')
    + (w.rate_measured === false ? '<li class="warn">' + esc(t('confirm.rate')) + '</li>' : '')
    + '<li>' + esc(t('confirm.load', { need: num(w.cu_estimate, 1) })) + '</li>'
    + '<li>' + esc(t('confirm.stops', { idle: num(w.idle_stop_min, 0), max: num(w.max_session_h, 0) })) + '</li>'
    + '<li>' + esc(w.balance_real
        ? t('confirm.balance', { left: num(w.cu_left, 1), after: num(w.cu_left_after, 1) })
        : t('confirm.budget', { budget: num(w.budget_cu, 0), left: num(w.cu_left, 1),
                                after: num(w.cu_left_after, 1) })) + '</li>'
    + '</ul>'
    + '<div class="actions">' + btn('go', t('btn.go'), 'primary', 'play') + btn('cancel', t('btn.cancel')) + '</div>'
    + '</div>';
}

function sessionChips() {
  const ep = st.endpoint || {}, L = st.link || {}, K = st.keepalive || {};
  let h = '<div class="chips">'
    + '<button type="button" class="chip wide" data-act="copy" data-t="host">' + ico('link')
    + '<b class="mono" data-v="host"></b></button>'
    + chip('pulse', 'link', L.ok === false ? 'alert' : '');
  if (st.stage === 'ready') {
    h += chip('hourglass', 'idle', st.idle_policy === 'off' ? 'off' : '')
      + chip('clock', 'uptime')
      + chip(K.holding ? 'shield' : 'shieldoff', 'hold', 'only' + (K.holding ? (K.ok === false ? ' alert' : '') : ' off'))
      + chip('key', 'key', 'only' + (ep.key ? '' : ' off'));
  }
  return h + '</div>';
}

function res(key, icon) {
  return '<div class="res" data-t="' + key + '" tabindex="0">' + ico(icon)
    + '<div class="bar"><i data-w="' + key + '"></i></div><b data-v="' + key + '"></b></div>';
}

function machineHTML() {
  const m = st.machine, sv = st.server || {}, g = (m && m.gpu) || {};
  let h = '<div class="blk"><div class="sub">' + ico('server') + '<span>' + esc(t('sec.machine')) + '</span>'
    + (m ? '<span class="tag" data-t="msrc" tabindex="0">' + esc(t(m.local ? 'machine.local' : 'machine.server')) + '</span>' : '')
    + '</div>';
  if (m) h += res('vram', 'cpu') + res('ram', 'memory') + res('disk', 'disk');
  else h += '<p class="fine">' + esc(t('machine.none')) + '</p>';
  const chips = [];
  if (g.util_pct != null) chips.push(chip('gauge', 'util'));
  if (g.temp_c != null) chips.push(chip('thermo', 'temp'));
  if (g.power_w != null) chips.push(chip('zap', 'power'));
  if (sv.context && sv.context.max_positions) chips.push(chip('ruler', 'ctx'));
  if (sv.vision) chips.push(chip(sv.vision.available ? 'eye' : 'eyeoff', 'vision',
                                 'only' + (sv.vision.available ? '' : sv.vision.enabled ? ' alert' : ' off')));
  if (sv.launch && sv.launch.cache_size) chips.push(chip('sliders', 'launch', 'only'));
  if (chips.length) h += '<div class="chips">' + chips.join('') + '</div>';
  return h + '</div>';
}

function moneyHTML() {
  const b = st.balance;
  return '<div class="blk"><div class="sub">' + ico('coins') + '<span>' + esc(t('sec.money')) + '</span>'
    + (b ? '<span class="tag">' + esc(t('money.src')) + '</span>' : '') + '</div>'
    + '<div class="figure' + (b ? '' : ' none') + '" data-t="balance" tabindex="0"><b data-v="balance"></b><span>CU</span></div>'
    + '<div class="chips">' + chip('flame', 'burn') + chip('battery', 'left')
    + (st.ledger_open ? chip('receipt', 'session') : '') + chip('cloud', 'billing') + '</div></div>';
}

function statusHTML() {
  const s = st.stage, moving = BUSY.includes(s) && s !== 'stopping', live = s === 'ready' || s === 'attached';
  const rec = currentRecipe();
  let h = '<div class="state"><b>' + esc(t('stage.' + s, null, s)) + '</b>'
    + (s === 'ready' && st.adopted ? '<span class="tag solid" data-t="adopted" tabindex="0">' + esc(t('tag.adopted')) + '</span>' : '')
    + (moving ? '<span class="pct" data-v="pct"></span>' : '') + '</div>';
  if (live || moving) {
    const model = st.live_model || (rec && rec.model);
    if (model) h += '<div class="who">' + esc(model) + (rec && s !== 'attached' ? ' · ' + esc(rec.card) : '') + '</div>';
  }
  if (moving) h += stepsHTML(s) + '<div class="bar"><i data-w="bar"></i></div>';
  if (live) h += sessionChips();
  h += '<p class="note" data-v="note"></p>';
  if (s === 'attached') h += '<p class="fine">' + esc(t('attached.body')) + '</p>';
  if (st.confirm) h += confirmHTML(st.confirm);
  if (s === 'ready' || st.machine) h += machineHTML();
  h += moneyHTML();
  const acts = [], ep = st.endpoint || {};
  // a tunnel that stopped answering, or a ready box whose key never arrived
  if (s === 'ready' && ((st.link && st.link.ok === false) || (!ep.key && !ep.key_pending))) {
    acts.push(btn('couple', t('btn.couple'), 'primary', 'refresh'));
  }
  if (['idle', 'stopped', 'failed'].includes(s) && oursLive(st) && !st.coupling) acts.push(btn('couple', t('btn.adopt'), '', 'login'));
  return h + acts.join('');
}

// ---- GPUs --------------------------------------------------------------------- //
function factsHTML(r) {
  const rows = FACT_ORDER.filter((k) => fact(r, k)).map((k) => {
    const f = fact(r, k);
    const tip = t(f.measured ? 'fact.measured' : 'fact.estimate', { src: f.src || '—' });
    return '<li class="' + (f.measured ? '' : 'est') + '" data-tip="' + esc(tip) + '" tabindex="0">'
      + ico(f.measured ? 'okc' : 'dashed', f.measured ? '' : 'est')
      + '<span>' + esc(t('fact.' + k)) + '</span><b>' + esc(factValue(k, f)) + '</b></li>';
  });
  return rows.length ? '<ul class="facts">' + rows.join('') + '</ul>' : '';
}

function gpuHTML(g, locked) {
  const list = gpuRecipes(g), r = chosenRecipe(g);
  const running = !!r && st.stage === 'ready' && st.selected === r.id;
  const rate = (g.facts || {}).cu_per_hour || {};
  const how = (f) => t(f && f.measured ? 'how.measured' : 'how.estimate');
  let h = '<article class="gpu' + (r && st.selected === r.id ? ' sel' : '') + '">'
    + '<div class="top"><b>' + esc(g.card) + '</b>'
    + (running ? '<span class="tag solid">' + esc(t('tag.current')) + '</span>' : '') + '</div>'
    + '<div class="chips">'
    + '<span class="chip' + (rate.measured ? '' : ' off') + '" tabindex="0" data-tip="' + esc(t('tip.rate', { how: how(rate) }))
    + '">' + ico('coins') + '<b>' + num(g.cu_per_hour, 2) + '/h</b></span>'
    + '<span class="chip" tabindex="0" data-tip="' + esc(t('tip.gvram')) + '">' + ico('cpu') + '<b>' + num(g.vram_gb, 0) + ' GB</b></span>'
    + (g.ram_gb ? '<span class="chip" tabindex="0" data-tip="' + esc(t('tip.gram')) + '">' + ico('memory') + '<b>' + num(g.ram_gb, 0) + ' GB</b></span>' : '')
    + '</div>';
  if (list.length) {
    h += '<label class="pick">' + ico('box', 'l')
      + '<select data-gpu="' + esc(g.id) + '" aria-label="' + esc(t('model.label') + ' · ' + g.card) + '">'
      + list.map((x) => '<option value="' + esc(x.id) + '"' + (r && x.id === r.id ? ' selected' : '') + '>'
        + esc(x.model + ' · ' + (x.quant || '') + ' — ' + t('status.' + x.status, null, x.status)) + '</option>').join('')
      + '</select>' + ico('chevron', 'r') + '</label>';
  }
  if (r) h += factsHTML(r);
  const can = !!r && r.runnable && !locked;
  h += '<button type="button" class="btn' + (running ? ' primary' : '') + '" data-act="pick" data-r="'
    + esc(r ? r.id : '') + '"' + (can && !pending ? '' : ' disabled') + '>'
    + ico(running ? 'check' : 'play')
    + esc(t(running ? 'recipe.running' : (r && r.runnable ? 'recipe.pick' : 'recipe.na'))) + '</button>';
  return h + '</article>';
}

function gpusHTML() {
  const s = st.stage;
  const locked = BUSY.includes(s) || s === 'ready' || s === 'attached' || !!st.confirm || !!st.downing;
  return (st.gpus || []).map((g) => gpuHTML(g, locked)).join('');
}

// ---- speed ------------------------------------------------------------------- //
function referenceRecipe() {
  return currentRecipe() || recipes().find((r) => r.verified) || recipes()[0] || null;
}

function stat(label, val, digits, tipKey) {
  return '<div class="stat" tabindex="0" data-tip="' + esc(t(tipKey)) + '"><small>' + label + '</small><b>'
    + (val === null || val === undefined ? '—' : num(val, digits)) + '</b><span>t/s</span></div>';
}

function speedHTML() {
  const live = st.metrics, r = referenceRecipe();
  const pre = live ? live.prefill : (fact(r, 'prefill_tps') || {}).v;
  const dec = live ? live.decode : (fact(r, 'decode_tps') || {}).v;
  let h = '<div class="pair">' + stat('PREFILL', pre, 0, 'tip.prefill') + stat('DECODE', dec, 1, 'tip.decode') + '</div>';
  if (live) {
    h += '<div class="chips">' + chip('timer', 'ttft') + chip('database', 'hit') + '</div>'
      + '<p class="fine" data-v="speedsrc"></p>';
  } else if (r) {
    const name = r.card + ' · ' + r.model;
    h += '<p class="fine">' + esc(t(pre === null || pre === undefined ? 'speed.none' : 'speed.where', { recipe: name })) + '</p>';
  }
  return h;
}

// ---- connection, log ------------------------------------------------------------ //
function details(id, summary, body) {
  return '<details data-d="' + id + '"' + (openDetails.has(id) ? ' open' : '') + '><summary>'
    + esc(summary) + '</summary><pre>' + esc(body) + '</pre></details>';
}

function connHTML() {
  const cli = st.cli || {}, bill = st.billing || {};
  const sessions = bill.sessions || [];
  return '<div class="chips">' + chip('terminal', 'cli', cli.colab === 'missing' ? 'alert' : '') + chip('layers', 'wsl') + '</div>'
    + (sessions.length ? '<ul class="list">' + sessions.map((x) => '<li>' + ico('cloud')
        + '<span>' + esc((x.name || '?') + ' · ' + (x.hardware || '?')) + '</span>'
        + (x.ours ? '<span class="tag solid">' + esc(t('session.ours')) + '</span>' : '')
        + '<span class="mono">' + esc(x.endpoint || '') + '</span></li>').join('') + '</ul>' : '')
    + details('cmd', t('det.command'), cli.command || t('det.command.none'))
    + details('bill', t('det.billing'), bill.raw || t('det.billing.none'));
}

function logHTML() {
  return '<pre class="log" data-v="log"></pre><p class="fine" data-v="foot"></p>';
}

// ---- values that change every poll are bound, not drawn -------------------------- //
function bindValues() {
  const v = {}, w = {}, tips = {};
  const ep = st.endpoint || {}, L = st.link || {}, K = st.keepalive || {}, b = st.balance;
  const mc = st.machine || {}, g = mc.gpu || {}, ram = mc.ram || {}, disk = mc.disk || {};
  const sv = st.server || {}, launch = sv.launch || {}, ctx = sv.context || {}, bill = st.billing || {};
  const probed = ago(st.machine_at || st.server_at);

  v.pct = num(st.progress, 0) + '%';
  v.note = words(st.note, 'note.');
  w.bar = Math.max(0, Math.min(100, st.progress || 0));

  v.host = hostOf(ep.base);
  tips.host = t('tip.endpoint', { url: ep.base || '—' });
  v.link = L.ok === true ? t('link.ok', { ms: num(L.latency_ms, 0) })
    : L.ok === false ? t('link.down', { n: L.fails || 0 }) : t('link.unknown');
  tips.link = t('tip.link');
  const idleOff = st.idle_policy === 'off';
  v.idle = idleOff ? '∞' : st.idle_left_s === null || st.idle_left_s === undefined ? '—' : clock(st.idle_left_s);
  tips.idle = t(idleOff ? 'tip.idle.off' : 'tip.idle', { idle: num(st.idle_stop_min, 0), max: num(st.max_session_h, 0) });
  v.uptime = clock((st.session_hours || 0) * 3600);
  tips.uptime = t('tip.uptime');
  tips.hold = !K.holding ? t('tip.hold.idle')
    : K.ok === false ? (K.err === 'gone' ? t('tip.hold.gone') : t('tip.hold.err', { err: K.err || '?' }))
    : K.at ? t('tip.hold.on', { ago: ago(K.at) }) : t('tip.hold.pending');
  tips.key = t(ep.key ? 'tip.key.held' : ep.key_pending ? 'tip.key.pending' : 'tip.key.none');
  tips.adopted = t('tip.adopted');

  tips.msrc = t(mc.local ? 'tip.msrc.local' : 'tip.msrc.server', { ago: probed });
  v.vram = g.total_mib ? t('res.used', { used: num(g.used_mib / 1024, 1), total: num(g.total_mib / 1024, 1) }) : '—';
  v.ram = ram.total_gib ? t('res.used', { used: num(ram.used_gib, 1), total: num(ram.total_gib, 1) }) : '—';
  v.disk = disk.total_gib ? t('res.free', { free: num(disk.free_gib, 0), total: num(disk.total_gib, 0) }) : '—';
  w.vram = g.total_mib ? (100 * (g.used_mib || 0)) / g.total_mib : 0;
  w.ram = ram.total_gib ? (100 * (ram.used_gib || 0)) / ram.total_gib : 0;
  w.disk = disk.total_gib ? 100 * (1 - (disk.free_gib || 0) / disk.total_gib) : 0;
  tips.vram = t('tip.vram') + ' · ' + tips.msrc;
  tips.ram = t('tip.ram') + ' · ' + tips.msrc;
  tips.disk = t('tip.disk') + ' · ' + tips.msrc;
  v.util = g.util_pct != null ? num(g.util_pct, 0) + '%' : '—';
  v.temp = g.temp_c != null ? num(g.temp_c, 0) + '°C' : '—';
  v.power = g.power_w != null ? num(g.power_w, 0) + ' W' : '—';
  tips.util = t('tip.util', { name: g.name || 'GPU' });
  tips.temp = t('tip.temp');
  tips.power = t('tip.power');
  v.ctx = ktok(ctx.max_positions);
  tips.ctx = ctx.yarn_factor ? t('tip.ctx.yarn', { f: ctx.yarn_factor, native: num(ctx.native, 0) }) : t('tip.ctx.native');
  tips.vision = !sv.vision ? '' : sv.vision.available ? t('tip.vision.on')
    : sv.vision.enabled ? t('tip.vision.err', { err: sv.vision.error || '?' }) : t('tip.vision.off');
  tips.launch = launch.cache_size ? t('tip.launch', { cache: num(launch.cache_size, 0), cq: launch.cache_quant,
      gcs: launch.generator_chunk_size, ccs: num(launch.cpu_cache_gb, 0), rcs: num(launch.recurrent_cache_gb, 0),
      ndt: launch.num_draft_tokens })
    + (sv.uptime_s != null ? ' · ' + t('machine.up', { up: dur(sv.uptime_s) }) : '') : '';

  const burning = !!(b && b.assignments && b.rate && b.cu !== null && b.cu !== undefined);
  v.balance = b ? num(b.cu, 2) : '—';
  tips.balance = b ? t('tip.balance', { ago: ago(b.checked_at) }) : t('money.unknown');
  v.burn = b ? num(burning ? b.rate : 0, 2) + '/h' : '—';
  tips.burn = b ? t(burning ? 'tip.burn' : 'tip.burn.none', { n: b.assignments || 0 }) : t('money.unknown');
  v.left = burning ? dur((b.cu / b.rate) * 3600) : '—';
  tips.left = t('tip.left');
  v.session = st.ledger_open && st.session_cu != null ? num(st.session_cu, 2) + ' CU' : '—';
  tips.session = t('tip.session', { h: num(st.session_hours, 2) });
  v.billing = bill.count === null || bill.count === undefined ? '?' : String(bill.count);
  tips.billing = bill.count === null || bill.count === undefined ? t('billing.unknown')
    : t('tip.billing') + (bill.ok === false ? ' · ' + t('billing.stale') : '');

  const m = st.metrics;
  if (m) {
    const hit = m.prompt_total ? (100 * (m.cache_n || 0)) / m.prompt_total : null;
    v.ttft = m.ttft_s == null ? '—' : num(m.ttft_s, 2) + ' s';
    v.hit = hit === null ? '—' : num(hit, 0) + '%';
    v.speedsrc = t(m.source === 'server' ? 'speed.src.server' : 'speed.src.proxy', { ago: ago(m.at) });
  }
  tips.ttft = t('tip.ttft');
  tips.hit = t('tip.hit');

  const cli = st.cli || {};
  v.cli = t('cli.' + (cli.colab || 'unknown'), null, cli.colab);
  tips.cli = t('tip.cli');
  v.wsl = cli.wsl || '—';
  tips.wsl = t('tip.wsl');
  v.log = (st.log_tail || []).slice(-10).join('\n') || t('log.empty');
  v.foot = words(st.foot, '');

  const run = currentRecipe(), ref = referenceRecipe();
  v['sum-gpus'] = st.stage === 'ready' && run ? t('gpus.running', { card: run.card })
    : t('gpus.sum', { n: (st.gpus || []).length, r: recipes().filter((r) => r.runnable).length });
  const pre = m ? m.prefill : (fact(ref, 'prefill_tps') || {}).v, dec = m ? m.decode : (fact(ref, 'decode_tps') || {}).v;
  v['sum-speed'] = (pre == null && dec == null) ? '—'
    : t(m ? 'speed.live' : 'speed.ref') + ' · ' + num(pre, 0) + ' / ' + num(dec, 1) + ' t/s';
  v['sum-conn'] = t('conn.sum', { cli: v.cli, n: v.billing });
  v['sum-log'] = (st.log_tail || []).slice(-1)[0] || '';

  // Widths first, before anything below reads layout: a bar that was just drawn
  // must be born at its width. Set after a layout read, it transitions up from 0
  // instead -- every stage change replayed the bar from empty, and in a page that
  // is not painting (a background tab) it stayed at 0.
  const rail = $('rail');
  for (const el of rail.querySelectorAll('[data-w]')) {
    const pct = Math.round((w[el.dataset.w] || 0) * 10) / 10 + '%';   // reads back identically
    if (el.style.width !== pct) el.style.width = pct;
  }
  for (const el of rail.querySelectorAll('[data-v]')) {
    const val = v[el.dataset.v] ?? '';
    if (el.textContent === val) continue;
    const stick = el.tagName === 'PRE' && el.scrollHeight - el.scrollTop - el.clientHeight < 8;
    el.textContent = val;
    if (stick) el.scrollTop = el.scrollHeight;
  }
  for (const el of rail.querySelectorAll('[data-t]')) {
    const tx = tips[el.dataset.t] ?? '';
    const val = el.querySelector('[data-v]');
    const label = val && val.textContent ? tx + ' · ' + val.textContent : tx;
    if (el.dataset.tip !== tx) el.dataset.tip = tx;
    if (el.getAttribute('aria-label') !== label) el.setAttribute('aria-label', label);
  }
  if (tipFor) {
    if (!document.contains(tipFor)) hideTip();
    else if ($('tip').textContent !== tipFor.dataset.tip) showTip(tipFor);
  }
}

function render() {
  renderHeader();
  if (!st) return;
  put('s-status', statusHTML());
  put('f-gpus', foldHTML('gpus', 'cpu', t('sec.gpus'), gpusHTML));
  put('f-speed', foldHTML('speed', 'gauge', t('sec.speed'), speedHTML));
  put('f-conn', foldHTML('conn', 'plug', t('sec.conn'), connHTML));
  put('f-log', foldHTML('log', 'scroll', t('sec.log'), logHTML));
  bindValues();
}

// ---- tooltips: one floating box, placed where it fits ------------------------------ //
let tipFor = null, tipTimer = null;
function showTip(el) {
  const text = el.dataset.tip;
  const tip = $('tip');
  // a redraw may have replaced the node since the hover began: its box is all zeros
  if (!text || !document.contains(el)) return hideTip();
  tip.textContent = text;
  tip.hidden = false;
  tipFor = el;
  const r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  let top = r.top - tr.height - 8;
  if (top < 8) top = r.bottom + 8;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - tr.width / 2, innerWidth - tr.width - 8));
  tip.style.top = Math.round(top) + 'px';
  tip.style.left = Math.round(left) + 'px';
}
function hideTip() {
  clearTimeout(tipTimer);
  $('tip').hidden = true;
  tipFor = null;
}
document.addEventListener('pointerover', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el || el === tipFor) return;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => showTip(el), 90);
});
document.addEventListener('pointerout', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && !el.contains(e.relatedTarget)) hideTip();
});
document.addEventListener('focusin', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el);
});
document.addEventListener('focusout', hideTip);
$('rail').addEventListener('scroll', hideTip, { passive: true });

// ---- talking to the control plane ------------------------------------------------ //
async function refresh() {
  try {
    const r = await fetch('/control/status', { cache: 'no-store' });
    st = await r.json();
    down = null;
  } catch (e) {
    down = String(e);
  }
  render();
}

async function post(path, body) {
  pending = true;
  render();
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify(body || {}) });
    let j = {};
    try { j = await r.json(); } catch (e) { /* not JSON */ }
    if (!r.ok && j && j.error) return { code: 'error', err: j.error.message || String(r.status) };
    return j;
  } catch (e) {
    return { code: 'error', err: String(e) };
  } finally {
    pending = false;
    await refresh();
  }
}

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 6000);
}

function say(r) {
  if (!r || !r.code || QUIET.includes(r.code)) return;
  const a = Object.assign({}, r);
  if (r.stage) a.stage = t('stage.' + r.stage, null, r.stage);
  if (r.cu_left !== undefined) a.left = num(r.cu_left, 1);
  if (r.cu_need !== undefined) a.need = num(r.cu_need, 1);
  toast(t('code.' + r.code, a, r.code));
}

function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  try { localStorage.setItem('collabosm.lang', l); } catch (e) { /* storage blocked */ }
  // The proxy words its own "no instance" error in this language (the WebUI shows it).
  document.cookie = 'collabosm_lang=' + l + '; path=/; max-age=31536000; SameSite=Strict';
  document.documentElement.lang = HTML_LANG[l];
  for (const k of Object.keys(drawn)) delete drawn[k];
  render();
}

document.addEventListener('click', async (e) => {
  const lb = e.target.closest('[data-lang]');
  if (lb) return setLang(lb.dataset.lang);
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  // local actions: nothing is sent, so they never wait for a POST
  if (act === 'fold') {
    folds[b.dataset.fold] = !isOpen(b.dataset.fold);
    saveJSON('collabosm.folds', folds);
    hideTip();
    return render();
  }
  if (act === 'copy') {
    const url = st && st.endpoint && st.endpoint.base;
    if (!url) return;
    try { await navigator.clipboard.writeText(url); toast(t('copied')); } catch (err) { toast(url); }
    return;
  }
  if (pending) return;
  hideTip();
  if (act === 'pick') say(await post('/control/select', { recipe: b.dataset.r }));
  else if (act === 'go' && st && st.confirm) {
    say(await post('/control/select', { recipe: st.confirm.recipe, confirm: true }));
  } else if (act === 'cancel') say(await post('/control/cancel', {}));
  else if (act === 'stop') say(await post('/control/stop', {}));
  else if (act === 'couple') say(await post('/control/couple', {}));
});

document.addEventListener('change', (e) => {
  const s = e.target.closest && e.target.closest('select[data-gpu]');
  if (!s) return;
  choice[s.dataset.gpu] = s.value;
  saveJSON('collabosm.choice', choice);
  render();
});

document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.dataset || !d.dataset.d) return;
  if (d.open) openDetails.add(d.dataset.d); else openDetails.delete(d.dataset.d);
}, true);

function toggleRail(force) {
  const m = $('main');
  m.classList.toggle('collapsed', force === undefined ? !m.classList.contains('collapsed') : force);
  hideTip();
  renderHeader();
}
$('toggle').addEventListener('click', () => toggleRail());
addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleRail(); }
  if (e.key === 'Escape') hideTip();
});

// Follow the WebUI's own light/dark mode (mode-watcher puts `dark` on its <html>).
// Read-only: the iframe is same-origin and nothing in it is changed. When it cannot
// be read, the shell falls back to the system preference.
let themeWatch = null;
function syncTheme() {
  let dark = null;
  try {
    const root = $('ui').contentDocument && $('ui').contentDocument.documentElement;
    if (root) {
      dark = root.classList.contains('dark');
      if (!themeWatch) {
        themeWatch = new MutationObserver(syncTheme);
        themeWatch.observe(root, { attributes: true, attributeFilter: ['class'] });
      }
    }
  } catch (e) { dark = null; }
  if (dark === null) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
$('ui').addEventListener('load', () => {
  if (themeWatch) themeWatch.disconnect();
  themeWatch = null;
  syncTheme();
});

if (innerWidth < 900) $('main').classList.add('collapsed');
setLang(lang);
refresh();
setInterval(refresh, 1500);
</script>
