<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>collabosm</title>
<style>
  /* Colour-blocked on purpose: the panel (header + rail) is always the WebUI's
     opposite. By day the WebUI is white, so the panel is warm ink; by night the
     WebUI is near-black, so the panel turns to paper. Neither end is pure -- #fff
     and #0a0a0a belong to the WebUI, and a panel that repeated them would read as
     part of it. The warmth stays low (little chroma) so it sits beside the WebUI's
     neutral greys instead of fighting them. The WebUI's own mode picks the side. */
  :root {
    --rail: 368px;
    --page: #ffffff; --page-scheme: light;         /* the WebUI's page, behind the iframe */
    --bg: #1b1a18; --raise: #24231f; --fg: #f3efe6; --muted: #aaa498; --faint: #7d786f;
    --line: rgba(243, 239, 230, .09); --line-strong: rgba(243, 239, 230, .18);
    --soft: rgba(243, 239, 230, .055); --ring: rgba(243, 239, 230, .18);
    --inv-bg: #f3efe6; --inv-fg: #1b1a18;
    --shadow: 0 18px 48px rgba(0, 0, 0, .30);
    --cjk: "PingFang SC", "Hiragino Sans", "Microsoft YaHei UI", "Microsoft YaHei",
           "Yu Gothic UI", "Noto Sans CJK SC";
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "JetBrains Mono", Menlo, monospace;
    color-scheme: dark;
  }
  :root:lang(ja) {
    --cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo,
           "Noto Sans JP", "Noto Sans CJK JP";
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0a0a0a; --page-scheme: dark;
      --bg: #eeebe4; --raise: #f6f4ef; --fg: #1b1a18; --muted: #68635a; --faint: #8a847a;
      --line: rgba(27, 26, 24, .10); --line-strong: rgba(27, 26, 24, .20);
      --soft: rgba(27, 26, 24, .05); --ring: rgba(27, 26, 24, .16);
      --inv-bg: #1b1a18; --inv-fg: #eeebe4;
      --shadow: 0 18px 48px rgba(0, 0, 0, .45);
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] {
    --page: #0a0a0a; --page-scheme: dark;
    --bg: #eeebe4; --raise: #f6f4ef; --fg: #1b1a18; --muted: #68635a; --faint: #8a847a;
    --line: rgba(27, 26, 24, .10); --line-strong: rgba(27, 26, 24, .20);
    --soft: rgba(27, 26, 24, .05); --ring: rgba(27, 26, 24, .16);
    --inv-bg: #1b1a18; --inv-fg: #eeebe4;
    --shadow: 0 18px 48px rgba(0, 0, 0, .45);
    color-scheme: light;
  }
  ::selection { background: var(--inv-bg); color: var(--inv-fg); }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, var(--cjk), sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button { font: inherit; color: inherit; }

  /* ---- header -------------------------------------------------------- */
  header {
    flex: none; height: 52px; display: flex; align-items: center; gap: 12px;
    padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
  .mark { width: 20px; height: 20px; border-radius: 6px; background: var(--fg); display: grid; place-items: center; flex: none; }
  .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--bg); }
  .status {
    display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 42vw; height: 28px;
    padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12.5px;
  }
  .status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
  .dot.on { background: var(--fg); border-color: var(--fg); }
  .dot.busy { border-color: var(--fg); animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 4px var(--ring); } }
  .spacer { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 9px; }
  .seg button {
    height: 26px; min-width: 32px; padding: 0 8px; border: 0; border-radius: 7px;
    background: transparent; color: var(--muted); font-size: 12px; font-weight: 550; cursor: pointer;
  }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center; flex: none; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: 9px; background: transparent;
  }
  .icon-btn:hover { border-color: var(--fg); }

  /* ---- buttons and small parts --------------------------------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    height: 36px; margin-top: 14px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 9px;
    background: transparent; font-weight: 550; cursor: pointer; transition: border-color .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--fg); }
  .btn.primary { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
  .btn.primary:hover:not(:disabled) { opacity: .86; }
  .btn:disabled { opacity: .42; cursor: not-allowed; }
  /* a disabled primary ("Running") is a quiet chip, not a half-transparent slab */
  .btn.primary:disabled { opacity: 1; background: var(--soft); color: var(--muted); border-color: var(--line-strong); }
  header .btn { width: auto; height: 32px; margin: 0; font-size: 12.5px; }
  .tag {
    display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px solid var(--line-strong);
    border-radius: 999px; font-size: 10.5px; font-weight: 550; color: var(--muted);
    letter-spacing: 0; text-transform: none; white-space: nowrap;
  }
  .tag.solid { background: var(--inv-bg); border-color: var(--inv-bg); color: var(--inv-fg); }
  .mono { font-family: var(--mono); font-size: 11.5px; }

  /* ---- layout -------------------------------------------------------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--rail); }
  main.collapsed { grid-template-columns: minmax(0, 1fr) 0; }
  main.collapsed #rail { display: none; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--page); color-scheme: var(--page-scheme); }
  #rail {
    min-width: 0; overflow-x: hidden; overflow-y: auto; border-left: 1px solid var(--line);
    background: var(--bg); overscroll-behavior: contain; scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  section { padding: 18px 20px 20px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  h2 {
    margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
  }
  :lang(zh) h2, :lang(ja) h2 { letter-spacing: .05em; }
  #toast {
    position: sticky; top: 0; z-index: 3; margin: 0; padding: 11px 20px;
    background: var(--inv-bg); color: var(--inv-fg); font-size: 12.5px;
  }

  /* ---- session ------------------------------------------------------- */
  .state { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .state b { font-size: 24px; font-weight: 650; letter-spacing: -.025em; line-height: 1.2; }
  .state .pct { color: var(--muted); font-variant-numeric: tabular-nums; }
  .steps {
    list-style: none; margin: 16px 0 14px; padding: 0; position: relative;
    display: grid; grid-template-columns: repeat(5, 1fr);
  }
  .steps::before, .steps::after { content: ""; position: absolute; top: 5px; left: 10%; height: 1px; }
  .steps::before { width: 80%; background: var(--line-strong); }
  .steps::after { width: calc(80% * var(--fill, 0)); background: var(--fg); transition: width .5s ease; }
  .steps li {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    gap: 7px; font-size: 11px; color: var(--faint); text-align: center;
  }
  .steps li i { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line-strong); }
  .steps li.done { color: var(--muted); }
  .steps li.done i { background: var(--fg); border-color: var(--fg); }
  .steps li.now { color: var(--fg); font-weight: 650; }
  .steps li.now i { border-color: var(--fg); animation: breathe 1.4s ease-in-out infinite; }
  .bar { height: 4px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .6s ease; }
  .note { margin: 12px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .note:empty { display: none; }
  .fine { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 16px 0 0; font-size: 12.5px; }
  .kv dt { color: var(--muted); }
  .kv dd {
    margin: 0; min-width: 0; text-align: right; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  .confirm { margin-top: 16px; padding: 16px; border: 1.5px solid var(--fg); border-radius: 14px; background: var(--raise); }
  .confirm h3 { margin: 0; font-size: 14.5px; font-weight: 650; line-height: 1.4; }
  .confirm .who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin-top: 4px; font-size: 12.5px; }
  .confirm .who span { color: var(--muted); }
  .confirm .usd { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .confirm ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  .confirm li + li { margin-top: 4px; }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 16px; }
  .actions .btn { margin: 0; }

  .figs, .specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .figs div, .specs div { padding: 8px 10px; border-radius: 9px; background: var(--soft); min-width: 0; }
  .figs b, .specs b { display: block; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .figs small, .specs small { display: block; margin-top: 1px; color: var(--muted); font-size: 10.5px; line-height: 1.3; }

  /* ---- recipes ------------------------------------------------------- */
  .recipe { padding: 14px; border: 1px solid var(--line-strong); border-radius: 12px; }
  .recipe + .recipe { margin-top: 10px; }
  .recipe.sel { border-color: var(--fg); }
  .recipe .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .recipe .top b { font-size: 14px; font-weight: 650; }
  .tags { display: inline-flex; gap: 6px; }
  .recipe .sub { margin-top: 2px; color: var(--muted); font-size: 12px; }

  /* ---- money, speed -------------------------------------------------- */
  .figure { display: flex; align-items: baseline; gap: 8px; }
  .figure b { font-size: 30px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .figure span { color: var(--muted); font-size: 12px; }
  .meter { height: 8px; margin-top: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .meter i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .5s ease; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 12px; }
  .stat small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  .stat b { display: inline-block; margin-top: 4px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat span { margin-left: 4px; color: var(--muted); font-size: 12px; }

  /* ---- connection, log ----------------------------------------------- */
  details { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  details + details { margin-top: 12px; }
  summary {
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    list-style: none; color: var(--muted); font-size: 12.5px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-family: var(--mono); }
  details[open] summary::after { content: "\2212"; }
  details pre, pre.log {
    margin: 10px 0 0; padding: 10px 12px; max-height: 200px; overflow: auto; border-radius: 10px;
    background: var(--soft); color: var(--muted); font: 11px/1.6 var(--mono);
    white-space: pre-wrap; word-break: break-all;
  }
  pre.log { margin: 0; }

  @media (max-width: 900px) {
    main, main.collapsed { grid-template-columns: minmax(0, 1fr); }
    #rail { position: fixed; top: 52px; right: 0; bottom: 0; z-index: 4; width: min(var(--rail), 100vw); box-shadow: var(--shadow); }
    .brand span:last-child { display: none; }
    .status { max-width: 34vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>collabosm</span></div>
  <div class="status" id="status"><i class="dot" id="dot" aria-hidden="true"></i><span id="status-text"></span></div>
  <span class="tag solid" id="rehearsal" hidden></span>
  <span class="spacer"></span>
  <div class="seg" id="langs" role="group">
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="zh" lang="zh-CN">中</button>
    <button type="button" data-lang="ja" lang="ja">日</button>
  </div>
  <button type="button" class="btn primary" id="stop" data-act="stop" hidden>
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>
    <span id="stop-label"></span>
  </button>
  <button type="button" class="icon-btn" id="toggle">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg>
  </button>
</header>
<main id="main">
  <iframe id="ui" src="/?embed=1" title="collabosm chat" allow="clipboard-write; clipboard-read"></iframe>
  <aside id="rail">
    <p id="toast" role="status" aria-live="polite" hidden></p>
    <section id="s-session"></section>
    <section id="s-recipes"></section>
    <section id="s-money"></section>
    <section id="s-speed"></section>
    <section id="s-conn"></section>
    <section id="s-log"></section>
  </aside>
</main>
<script>
'use strict';
// The upstream WebUI registers a service worker at scope "/" (workbox, sw.js).
// A shell cached by an older build is how a stale injected panel came back once
// -- a second copy of this rail inside the iframe. Drop both on load: the files
// here are local, so nothing needs to be cached.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
}

// Every word the rail shows. control.py sends codes and numbers only: a note is
// {k, a}, and an answer carries `code`.

const HTML_LANG = { en: 'en', zh: 'zh-CN', ja: 'ja' };
const LOCALE = { en: 'en-US', zh: 'zh-CN', ja: 'ja-JP' };
const STEPS = ['requesting', 'uploading', 'bootstrapping', 'loading', 'ready'];
const BUSY = ['requesting', 'uploading', 'bootstrapping', 'loading', 'stopping'];
const QUIET = ['confirm_required', 'started', 'cancelled', 'stopping'];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let lang = pickLang();
let st = null;          // the last /control/status
let down = null;        // why the control plane could not be read, when it could not
let pending = false;    // a POST is in flight: every action waits for it (Start bills)
const drawn = {};       // section id -> markup it holds; unchanged sections are left alone,
                        // so buttons keep focus and <details> stay open between polls
const openDetails = new Set();
let toastTimer = null;

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem('collabosm.lang'); } catch (e) { /* storage blocked */ }
  if (saved && I18N[saved]) return saved;
  const nav = String(navigator.language || '').toLowerCase();
  return nav.startsWith('zh') ? 'zh' : nav.startsWith('ja') ? 'ja' : 'en';
}

function t(key, args, fallback) {
  const s = I18N[lang][key] ?? I18N.en[key] ?? fallback ?? key;
  return args ? s.replace(/\{(\w+)\}/g, (m, k) => (args[k] ?? m)) : s;
}

function num(n, digits) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
  const d = digits ?? 1;
  return new Intl.NumberFormat(LOCALE[lang], { minimumFractionDigits: d, maximumFractionDigits: d })
    .format(Number(n));
}

function clock(sec) {
  if (sec === null || sec === undefined) return '—';
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const two = (x) => String(x).padStart(2, '0');
  return h ? h + ':' + two(m) + ':' + two(s) : m + ':' + two(s);
}

// A note from control.py, worded in the current language.
function words(n, prefix) {
  if (!n || !n.k) return '';
  const a = Object.assign({}, n.a || {});
  if (a.reason !== undefined) a.reason = t('reason.' + a.reason, null, a.reason);
  if (a.vm !== undefined) a.vm = t('vm.' + a.vm, null, a.vm);
  if (n.k === 'fail.exit') a.why = t('exit.' + a.rc, null, t('exit.other'));
  for (const k of ['cu', 'cuph']) if (typeof a[k] === 'number') a[k] = num(a[k], 2);
  let s = t(prefix + n.k, a, n.k);
  if (a.autostop === 'running' || a.autostop === 'done') s += t('autostop.' + a.autostop);
  return s;
}

function stoppable(s) {
  return (BUSY.includes(s.stage) && s.stage !== 'stopping') || s.stage === 'ready'
    || s.stage === 'failed' || (s.ledger_open && (s.stage === 'idle' || s.stage === 'stopped'));
}

function btn(act, label, kind, attrs) {
  return '<button type="button" class="btn ' + (kind || '') + '" data-act="' + act + '" '
    + (attrs || '') + (pending ? ' disabled' : '') + '>' + esc(label) + '</button>';
}

function put(id, html) {
  if (drawn[id] === html) return;
  $(id).innerHTML = html;
  drawn[id] = html;
}

// ---- header ------------------------------------------------------------ //
function renderHeader() {
  let cls = 'dot', label;
  if (down) label = t('hdr.unreachable');
  else if (!st) label = t('hdr.loading');
  else {
    const s = st.stage, name = t('stage.' + s, null, s);
    if (s === 'ready' || s === 'attached') { cls += ' on'; label = name + ' · ' + (st.live_model || ''); }
    else if (BUSY.includes(s)) {
      cls += ' busy';
      label = s === 'stopping' ? name : name + ' · ' + num(st.progress, 0) + '%';
    } else label = name;
  }
  $('dot').className = cls;
  if ($('status-text').textContent !== label) $('status-text').textContent = label;
  $('status').title = label;
  document.title = 'collabosm · ' + label;
  $('rehearsal').hidden = !(st && st.fake);
  $('rehearsal').textContent = t('badge.rehearsal');
  $('stop').hidden = !(st && stoppable(st));
  $('stop').disabled = pending;
  $('stop-label').textContent = t('btn.stop');
  for (const b of document.querySelectorAll('#langs button')) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  }
  $('langs').setAttribute('aria-label', t('lang.label'));
  const collapsed = $('main').classList.contains('collapsed');
  $('toggle').title = t(collapsed ? 'toggle.show' : 'toggle.hide');
  $('toggle').setAttribute('aria-label', $('toggle').title);
  $('toggle').setAttribute('aria-expanded', String(!collapsed));
}

// ---- sections ---------------------------------------------------------- //
function stepsHTML(s) {
  const at = s === 'ready' ? STEPS.length : STEPS.indexOf(s);
  const fill = s === 'ready' ? 1 : Math.max(0, at) / (STEPS.length - 1);
  let h = '<ol class="steps" style="--fill:' + fill.toFixed(3) + '">';
  STEPS.forEach((k, i) => {
    const cls = i < at ? 'done' : i === at ? 'now' : '';
    h += '<li class="' + cls + '"><i></i><span>' + esc(t('step.' + k)) + '</span></li>';
  });
  return h + '</ol>';
}

function confirmHTML(w) {
  return '<div class="confirm" role="group" aria-label="' + esc(t('confirm.head')) + '">'
    + '<h3>' + esc(t('confirm.head')) + '</h3>'
    + '<div class="who"><b>' + esc(w.card) + '</b><span>' + esc(w.model) + '</span></div>'
    + '<div class="figs">'
    + '<div><b>' + num(w.cu_per_hour, 2) + '</b><small>' + esc(t('confirm.cuph')) + '</small></div>'
    + '<div><b>~' + num(w.eta_min, 0) + '</b><small>' + esc(t('confirm.eta')) + '</small></div>'
    + '<div><b>~' + num(w.cu_estimate, 1) + '</b><small>' + esc(t('confirm.need')) + '</small></div>'
    + '</div>'
    + '<p class="usd">' + esc(t('confirm.usd', { usd: num(w.usd_per_hour, 2) })) + '</p>'
    + '<ul>'
    + '<li>' + esc(t('confirm.load', { need: num(w.cu_estimate, 1) })) + '</li>'
    + '<li>' + esc(t('confirm.stops', { idle: num(w.idle_stop_min, 0), max: num(w.max_session_h, 0) })) + '</li>'
    + '<li>' + esc(t('confirm.budget', { budget: num(w.budget_cu, 0), left: num(w.cu_left, 1),
                                          after: num(w.cu_left_after, 1) })) + '</li>'
    + '</ul>'
    + '<div class="actions">' + btn('go', t('btn.go'), 'primary') + btn('cancel', t('btn.cancel')) + '</div>'
    + '</div>';
}

function endpointRows(ep) {
  return '<dt>' + esc(t('row.model')) + '</dt><dd>' + esc(st.live_model || '—') + '</dd>'
    + '<dt>' + esc(t('row.endpoint')) + '</dt><dd class="mono" title="' + esc(ep.base || '') + '">'
    + esc(ep.base || '—') + '</dd>';
}

function sessionHTML() {
  const s = st.stage, moving = BUSY.includes(s) && s !== 'stopping';
  const ep = st.endpoint || {};
  let h = '<h2>' + esc(t('sec.session')) + '</h2>'
    + '<div class="state"><b>' + esc(t('stage.' + s, null, s)) + '</b>'
    + (moving ? '<span class="pct" data-v="pct"></span>' : '') + '</div>';
  if (moving || s === 'ready') h += stepsHTML(s);
  if (moving) h += '<div class="bar"><i data-w="bar"></i></div>';
  h += '<p class="note" data-v="note"></p>';
  if (st.confirm) h += confirmHTML(st.confirm);
  if (s === 'ready') {
    const key = ep.key ? t('key.held') : ep.key_pending ? t('key.pending') : t('key.none');
    h += '<dl class="kv">' + endpointRows(ep)
      + '<dt>' + esc(t('row.key')) + '</dt><dd>' + esc(key) + '</dd>'
      + '<dt>' + esc(t('row.idle')) + '</dt><dd data-v="idle"></dd>'
      + '<dt>' + esc(t('row.uptime')) + '</dt><dd data-v="uptime"></dd></dl>'
      + btn('stop', t('btn.stopbill'));
  } else if (s === 'attached') {
    h += '<dl class="kv">' + endpointRows(ep) + '</dl>'
      + '<p class="fine">' + esc(t('attached.body')) + '</p>' + btn('stop', t('btn.detach'));
  } else if (s === 'failed') {
    h += btn('stop', t('btn.stopagain'));
  } else if (st.ledger_open && (s === 'idle' || s === 'stopped')) {
    h += btn('stop', t('btn.stopstale'), 'primary');
  }
  return h;
}

function recipesHTML() {
  const s = st.stage;
  const locked = pending || BUSY.includes(s) || s === 'ready' || s === 'attached' || !!st.confirm;
  let h = '<h2>' + esc(t('sec.recipes')) + '</h2>';
  for (const r of st.recipes || []) {
    const sel = st.selected === r.id, running = s === 'ready' && sel;
    const note = r.note ? (r.note[lang] || r.note.en || '') : '';
    h += '<article class="recipe' + (sel ? ' sel' : '') + '">'
      + '<div class="top"><b>' + esc(r.card) + '</b><span class="tags">'
      + (sel ? '<span class="tag solid">' + esc(t('tag.current')) + '</span>' : '')
      + (r.verified ? '' : '<span class="tag">' + esc(t('tag.unverified')) + '</span>')
      + '</span></div>'
      + '<div class="sub">' + esc(r.model) + ' · ' + esc(r.quant) + '</div>'
      + '<div class="specs">'
      + '<div><b>' + num(r.cu_per_hour, 2) + '</b><small>' + esc(t('spec.cuph')) + '</small></div>'
      + '<div><b>' + num(r.vram_gb, 0) + '</b><small>' + esc(t('spec.vram')) + '</small></div>'
      + '<div><b>~' + num(r.eta_min, 0) + '</b><small>' + esc(t('spec.eta')) + '</small></div>'
      + '</div>'
      + (note ? '<p class="fine">' + esc(note) + '</p>' : '')
      + '<button type="button" class="btn' + (running ? ' primary' : '') + '" data-act="pick" data-r="'
      + esc(r.id) + '"' + (locked ? ' disabled' : '') + '>'
      + esc(t(running ? 'recipe.running' : 'recipe.pick')) + '</button>'
      + '</article>';
  }
  return h;
}

function moneyHTML() {
  return '<h2>' + esc(t('sec.money')) + '</h2>'
    + '<div class="figure"><b data-v="used"></b><span>' + esc(t('money.used')) + '</span></div>'
    + '<div class="meter"><i data-w="meter"></i></div>'
    + '<p class="fine" data-v="left"></p>'
    + '<dl class="kv">'
    + '<dt>' + esc(t('row.session')) + '</dt><dd data-v="session"></dd>'
    + '<dt>' + esc(t('row.idlestop')) + '</dt><dd>' + esc(t('unit.min', { n: num(st.idle_stop_min, 0) })) + '</dd>'
    + '<dt>' + esc(t('row.ceiling')) + '</dt><dd>' + esc(t('unit.h', { n: num(st.max_session_h, 0) })) + '</dd>'
    + '</dl>';
}

function speedHTML() {
  // `metrics` is a live measurement when something takes one; until then these are
  // the repo's reference numbers, and they are labelled as exactly that.
  const live = st.metrics, m = st.measured || {}, src = live || m;
  return '<h2>' + esc(t('sec.speed')) + '<span class="tag">' + esc(t(live ? 'speed.live' : 'speed.ref'))
    + '</span></h2>'
    + '<div class="pair">'
    + '<div class="stat"><small>PREFILL</small><b>' + num(src.prefill, 0) + '</b><span>t/s</span></div>'
    + '<div class="stat"><small>DECODE</small><b>' + num(src.decode, 1) + '</b><span>t/s</span></div>'
    + '</div>'
    + (live ? '' : '<p class="fine">' + esc(t('speed.where', { date: m.measured_on || '', card: m.card || '' }))
        + ' ' + esc(t('speed.gcs', { n: num(m.prefill_gcs8192, 0) })) + '</p>');
}

function details(id, summary, body) {
  return '<details data-d="' + id + '"' + (openDetails.has(id) ? ' open' : '') + '><summary>'
    + esc(summary) + '</summary><pre>' + esc(body) + '</pre></details>';
}

function connHTML() {
  const cli = st.cli || {}, bill = st.billing || {};
  const billing = (bill.count === null || bill.count === undefined) ? t('billing.unknown') : num(bill.count, 0);
  return '<h2>' + esc(t('sec.conn')) + '</h2>'
    + '<dl class="kv">'
    + '<dt>' + esc(t('row.cli')) + '</dt><dd>' + esc(t('cli.' + (cli.colab || 'unknown'), null, cli.colab)) + '</dd>'
    + '<dt>' + esc(t('row.wsl')) + '</dt><dd>' + esc(cli.wsl || '—') + '</dd>'
    + '<dt>' + esc(t('row.billing')) + '</dt><dd>' + esc(billing) + '</dd>'
    + '</dl>'
    + details('cmd', t('det.command'), cli.command || t('det.command.none'))
    + details('bill', t('det.billing'), bill.raw || t('det.billing.none'));
}

function logHTML() {
  return '<h2>' + esc(t('sec.log')) + '</h2><pre class="log" data-v="log"></pre>'
    + '<p class="fine" data-v="foot"></p>';
}

// Values that change every poll are bound into the drawn markup, not drawn into it.
function bindValues() {
  const v = {
    pct: num(st.progress, 0) + '%',
    note: words(st.note, 'note.'),
    idle: st.idle_left_s === null || st.idle_left_s === undefined ? '—' : clock(st.idle_left_s),
    uptime: clock((st.session_hours || 0) * 3600),
    used: num(st.cu_used, 2),
    left: t('money.left', { left: num(st.cu_left, 1), budget: num(st.budget_cu, 0) }),
    session: t('unit.h', { n: num(st.session_hours, 2) }),
    log: (st.log_tail || []).slice(-10).join('\n') || t('log.empty'),
    foot: words(st.foot, ''),
  };
  const w = {
    bar: Math.max(0, Math.min(100, st.progress || 0)),
    meter: st.budget_cu ? Math.min(100, (100 * (st.cu_used || 0)) / st.budget_cu) : 0,
  };
  // Widths first, before anything below reads layout: a bar that was just drawn
  // must be born at its width. Set after a layout read, it transitions up from 0
  // instead -- every stage change replayed the bar from empty, and in a page that
  // is not painting (a background tab) it stayed at 0.
  for (const el of $('rail').querySelectorAll('[data-w]')) {
    const pct = Math.round((w[el.dataset.w] || 0) * 10) / 10 + '%';   // reads back identically
    if (el.style.width !== pct) el.style.width = pct;
  }
  for (const el of $('rail').querySelectorAll('[data-v]')) {
    const val = v[el.dataset.v] ?? '';
    if (el.textContent === val) continue;
    const stick = el.tagName === 'PRE' && el.scrollHeight - el.scrollTop - el.clientHeight < 8;
    el.textContent = val;
    if (stick) el.scrollTop = el.scrollHeight;
  }
}

function render() {
  renderHeader();
  if (!st) return;
  put('s-session', sessionHTML());
  put('s-recipes', recipesHTML());
  put('s-money', moneyHTML());
  put('s-speed', speedHTML());
  put('s-conn', connHTML());
  put('s-log', logHTML());
  bindValues();
}

// ---- talking to the control plane --------------------------------------- //
async function refresh() {
  try {
    const r = await fetch('/control/status', { cache: 'no-store' });
    st = await r.json();
    down = null;
  } catch (e) {
    down = String(e);
  }
  render();
}

async function post(path, body) {
  pending = true;
  render();
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify(body || {}) });
    let j = {};
    try { j = await r.json(); } catch (e) { /* not JSON */ }
    if (!r.ok && j && j.error) return { code: 'error', err: j.error.message || String(r.status) };
    return j;
  } catch (e) {
    return { code: 'error', err: String(e) };
  } finally {
    pending = false;
    await refresh();
  }
}

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 6000);
}

function say(r) {
  if (!r || !r.code || QUIET.includes(r.code)) return;
  if (r.code === 'unverified') {
    const rec = ((st && st.recipes) || []).find((x) => x.id === r.recipe);
    return toast(rec && rec.note ? (rec.note[lang] || rec.note.en) : r.code);
  }
  const a = Object.assign({}, r);
  if (r.stage) a.stage = t('stage.' + r.stage, null, r.stage);
  if (r.cu_left !== undefined) a.left = num(r.cu_left, 1);
  if (r.cu_need !== undefined) a.need = num(r.cu_need, 1);
  toast(t('code.' + r.code, a, r.code));
}

function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  try { localStorage.setItem('collabosm.lang', l); } catch (e) { /* storage blocked */ }
  // The proxy words its own "no instance" error in this language (the WebUI shows it).
  document.cookie = 'collabosm_lang=' + l + '; path=/; max-age=31536000; SameSite=Strict';
  document.documentElement.lang = HTML_LANG[l];
  for (const k of Object.keys(drawn)) delete drawn[k];
  render();
}

document.addEventListener('click', async (e) => {
  const lb = e.target.closest('[data-lang]');
  if (lb) return setLang(lb.dataset.lang);
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || pending) return;
  const act = b.dataset.act;
  if (act === 'pick') say(await post('/control/select', { recipe: b.dataset.r }));
  else if (act === 'go' && st && st.confirm) {
    say(await post('/control/select', { recipe: st.confirm.recipe, confirm: true }));
  } else if (act === 'cancel') say(await post('/control/cancel', {}));
  else if (act === 'stop') say(await post('/control/stop', {}));
});

document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.dataset || !d.dataset.d) return;
  if (d.open) openDetails.add(d.dataset.d); else openDetails.delete(d.dataset.d);
}, true);

function toggleRail(force) {
  const m = $('main');
  m.classList.toggle('collapsed', force === undefined ? !m.classList.contains('collapsed') : force);
  renderHeader();
}
$('toggle').addEventListener('click', () => toggleRail());
addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleRail(); }
});

// Follow the WebUI's own light/dark mode (mode-watcher puts `dark` on its <html>).
// Read-only: the iframe is same-origin and nothing in it is changed. When it cannot
// be read, the shell falls back to the system preference.
let themeWatch = null;
function syncTheme() {
  let dark = null;
  try {
    const root = $('ui').contentDocument && $('ui').contentDocument.documentElement;
    if (root) {
      dark = root.classList.contains('dark');
      if (!themeWatch) {
        themeWatch = new MutationObserver(syncTheme);
        themeWatch.observe(root, { attributes: true, attributeFilter: ['class'] });
      }
    }
  } catch (e) { dark = null; }
  if (dark === null) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
$('ui').addEventListener('load', () => {
  if (themeWatch) themeWatch.disconnect();
  themeWatch = null;
  syncTheme();
});

if (innerWidth < 900) $('main').classList.add('collapsed');
setLang(lang);
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
