<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>collabosm</title>
<style>
  :root{--rail:340px;--bg:#0b0e13;--panel:#10131a;--line:#232a36;--fg:#e8ecf3;--dim:#8b97a8}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
       font:13px/1.45 ui-sans-serif,system-ui,Segoe UI,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  header b{font-weight:600;font-size:13px}
  header .sp{flex:1}
  header button{background:#1b2230;color:#cfe0ff;border:1px solid #2b3444;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
  main{flex:1;display:grid;grid-template-columns:1fr var(--rail);min-height:0;transition:grid-template-columns .18s ease}
  main.collapsed{grid-template-columns:1fr 0px}
  iframe{border:0;width:100%;height:100%;background:#fff}
  #rail{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  main.collapsed #rail{display:none}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;color:var(--dim);padding:10px 6px;cursor:pointer;font-size:12px;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--fg);border-bottom-color:#4c8dff}
  #body{flex:1;overflow:auto;padding:10px 12px}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#161a23}
  .meta{color:var(--dim);font-size:12px;margin-top:3px}
  .btn{margin-top:8px;width:100%;padding:7px 10px;border-radius:8px;border:1px solid #2f6fd0;background:#1b2b45;color:#cfe0ff;cursor:pointer;font-size:12px}
  .btn[disabled]{opacity:.5;cursor:default}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:#4c8dff;transition:width .4s}
  .kv{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;color:#b9c4d4}
  .kv span:last-child{color:var(--fg)}
  .st{font-size:12px;color:#9fb4d8;margin-top:6px}
  code{background:#0d1016;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<header>
  <b>collabosm</b>
  <span class="meta" id="hdr">正在读取控制面…</span>
  <span class="sp"></span>
  <button id="toggle">收起右栏 ⌘B</button>
</header>
<main id="main">
  <iframe id="ui" src="/?embed=1" title="collabosm chat" allow="clipboard-write; clipboard-read"></iframe>
  <aside id="rail">
    <div class="tabs">
      <button data-tab="cards" class="on">卡与配方</button>
      <button data-tab="conn">连接</button>
      <button data-tab="stat">状态</button>
    </div>
    <div id="body"></div>
  </aside>
</main>
<script>
let st = null, tab = 'cards', timer = null;
const $ = (id) => document.getElementById(id);
const fmt = (n, d) => (n === null || n === undefined) ? '—' : Number(n).toFixed(d === undefined ? 1 : d);

$('toggle').onclick = () => {
  const m = $('main');
  m.classList.toggle('collapsed');
  $('toggle').textContent = m.classList.contains('collapsed') ? '展开右栏 ⌘B' : '收起右栏 ⌘B';
};
addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); $('toggle').click(); } });
for (const b of document.querySelectorAll('.tabs button')) {
  b.onclick = () => { tab = b.dataset.tab; for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b); render(); };
}

async function refresh() {
  try { st = await (await fetch('/control/status', { cache: 'no-store' })).json(); render(); }
  catch (e) { $('hdr').textContent = '控制面不可达：' + e; }
}

function render() {
  if (!st) return;
  const busy = st.stage && st.stage !== 'idle' && st.stage !== 'ready';
  $('hdr').textContent = st.stage === 'ready' ? ('已就绪 · ' + st.live_model)
                        : (busy ? (st.stage_label + ' · ' + fmt(st.progress, 0) + '%') : '无卡无模型');
  let h = '';
  if (tab === 'cards') {
    for (const r of st.recipes) {
      const sel = st.selected === r.id, dis = (busy || st.stage === 'ready') ? 'disabled' : '';
      h += '<div class="card"><b>' + r.card + '</b>' + (sel ? ' · 当前' : '') +
           '<div class="meta">' + r.model + ' · ' + r.quant + '</div>' +
           '<div class="meta">' + fmt(r.cu_per_hour, 2) + ' CU/h · ' + r.vram_gb + ' GB 显存 · 预计 ' + r.eta_min + ' 分钟</div>' +
           '<button class="btn" data-r="' + r.id + '" ' + dis + '>' + (sel && st.stage === 'ready' ? '已就绪' : '选它并启动') + '</button></div>';
    }
    if (busy) h += '<div class="card"><b>' + st.stage_label + '</b><div class="bar"><i style="width:' + st.progress + '%"></i></div><div class="st">' + st.progress_note + '</div></div>';
  } else if (tab === 'conn') {
    h += '<div class="card"><b>Colab CLI</b><div class="meta">已安装 · 已授权</div></div>';
    h += '<div class="card"><b>当前端点</b><div class="meta"><code>http://127.0.0.1:3010/v1</code></div>' +
         '<div class="meta">密钥由本地代理持有，不进浏览器</div></div>';
    h += '<div class="card"><b>借用别人的卡</b><div class="meta">粘贴 URL + key 即可（可选）</div>' +
         '<div class="meta">' + (st.recipes.length ? '已有 ' + st.recipes.length + ' 个配方可选' : '') + '</div></div>';
  } else {
    const m = st.metrics || {};
    h = '<div class="card"><b>本次会话</b>' +
        '<div class="kv"><span>prefill</span><span>' + fmt(m.prefill, 0) + ' t/s</span></div>' +
        '<div class="kv"><span>decode</span><span>' + fmt(m.decode, 1) + ' t/s</span></div>' +
        '<div class="kv"><span>剩余 CU</span><span>' + fmt(st.cu_left, 1) + '</span></div>' +
        '<div class="kv"><span>空闲自动停机</span><span>' + st.idle_stop_min + ' 分钟</span></div></div>';
  }
  $('body').innerHTML = h;
  for (const b of document.querySelectorAll('.btn')) b.onclick = () => select(b.dataset.r);
}
async function select(id) { await fetch('/control/select', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recipe: id }) }); refresh(); }

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
