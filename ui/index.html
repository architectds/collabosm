<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>collabosm</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .home { max-width: 760px; margin: 8vh auto; padding: 0 20px; }
  .home h1 { margin: 0 0 6px; font-size: 26px; }
  .home p.sub { color: var(--dim); margin: 0 0 28px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { display: block; text-decoration: none; color: var(--fg); background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .card:hover { border-color: var(--accent); }
  .card h2 { margin: 0 0 6px; font-size: 17px; }
  .card span { color: var(--dim); font-size: 13px; }
  .card .tag { display: inline-block; margin-top: 12px; font-size: 11px; color: var(--dim);
               border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
</style>
</head>
<body>
<div class="home">
  <h1>collabosm</h1>
  <p class="sub">One endpoint, two windows: chat with the model, or watch what it is doing.</p>
  <div class="cards">
    <a class="card" href="chat">
      <h2>Chat</h2>
      <span>Conversations with the model, streamed. Thinking shows collapsed.</span>
      <div class="tag">/chat</div>
    </a>
    <a class="card" href="status">
      <h2>Status &amp; metrics</h2>
      <span>Endpoint state, live generation, and measured prefill / decode / ttft per turn.</span>
      <div class="tag">/status</div>
    </a>
  </div>
</div>
</body>
</html>
